interface:
  display_name: "Lvsea Writing"
  short_description: "中文事实写作、plain 清楚改写、风格校准、初稿后复查与深度长文工作流助手"
  default_prompt: "使用 $lvsea-writing，先锁定写作契约，按资料、结构、读者、声音和场景推进；用户要求 plain/deslopify 时先说结论、用普通词、保留必要术语，按需输出 revision-view；完整初稿后再做本地复查分流，最后一步去 AI 味，并完成作者人工终审门。"

policy:
  allow_implicit_invocation: true
