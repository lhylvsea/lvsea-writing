interface:
  display_name: "Lvsea Writing Boss"
  short_description: "单入口中文事实写作路由：按需调用素材专家，完成研究、结构、成稿，最后才做严格去 AI 味和人工终审"
  default_prompt: "使用 $lvsea-writing 作为唯一入口，先判断是小红书素材研究、普通写作还是完整成稿后处理；需要素材雷达时调用 $lvsea-xiezuo，需要最后白名单式去 AI 味时调用 $lieflat-less-ai-tone，其他阶段由本 Skill 完成。不要同时加载全部专家，最后保留事实核查与人工终审门。"
  examples:
    - "用 $lvsea-writing 把这批资料先整理成证据账本和文章主线，再逐段写稿，最后才去 AI 味。"
    - "用 $lvsea-writing 学我的样本和场景语气，不要先套人味提示词，也不要编造经历。"
    - "用 $lvsea-writing 写一篇技术教程，研究、结构、代码和链接核验后，再做最后审校。"
    - "先用 $lvsea-writing 检测，不改原文；给出问题、证据边界和最小修改方案。"
    - "从小红书素材开始写一篇文章：先走素材证据和二创简报，再完成正文，最后严格去 AI 味。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
    - "vscode"
  activation:
    mode: "implicit-or-explicit"
    paths: ["$lvsea-writing", "写作流水线", "最后去 AI 味", "先研究再写"]
  execution:
    context: "inline"
    shell: "bash-or-powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow read-only source review; forbid unreviewed code execution"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "only when research is requested or needed for a changing/unknown fact"
    file_write: "draft artifacts only when requested"
    subprocess: "local checker and package validation only"
    interactive: "ask only when a missing fact, reader, format, or author decision changes the result"
  degradation:
    openai: "single-entry routed workflow"
    claude: "single-entry routed workflow"
    generic: "neutral-source workflow with explicit stage labels"
    agent-skills-compatible: "canonical-source workflow"
    vscode: "file-backed workflow with manual final gate"
